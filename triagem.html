<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Triagem do portfólio — Raulzito</title>
<style>
:root{
  --ink:#f2efe9; --ink-dim:#9b968d; --bg:#0d0d0e; --surface:#171718;
  --line:#2a2a2c; --accent:#e2543a; --ok:#4ca96b; --warn:#d9a441; --live:#c84b8c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;}
header{position:sticky;top:0;z-index:10;background:rgba(13,13,14,.96);
  border-bottom:1px solid var(--line);padding:14px 20px;backdrop-filter:blur(6px)}
h1{margin:0 0 4px;font-size:18px;letter-spacing:.14em;text-transform:uppercase}
.sub{color:var(--ink-dim);font-size:13px;margin-bottom:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search]{background:var(--surface);border:1px solid var(--line);color:var(--ink);
  padding:8px 12px;border-radius:4px;font-size:14px;min-width:240px}
button{background:var(--surface);border:1px solid var(--line);color:var(--ink);
  padding:8px 14px;border-radius:4px;font-size:13px;cursor:pointer;font-family:inherit}
button:hover{border-color:var(--ink-dim)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.counts{color:var(--ink-dim);font-size:13px;margin-left:auto}
.counts b{color:var(--ink)}
main{padding:16px 20px 120px;display:grid;gap:10px;max-width:1500px}
.row{display:grid;grid-template-columns:160px 1fr auto;gap:14px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-left:3px solid transparent;
  border-radius:4px;padding:10px}
.row[data-done="1"]{opacity:.5}
.row img{width:160px;aspect-ratio:16/9;object-fit:cover;border-radius:3px;display:block;background:#000}
.t{font-size:14px;line-height:1.35;margin:0 0 5px}
.t a{color:var(--ink);text-decoration:none}
.t a:hover{color:var(--accent);text-decoration:underline}
.meta{color:var(--ink-dim);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}
.acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:420px}
.acts button{padding:6px 9px;font-size:12px;min-height:34px}
.acts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.acts button.star[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#111}
.acts button.no[aria-pressed="true"]{background:#3a3a3c;border-color:#55555a;color:var(--ink-dim)}
.empty{color:var(--ink-dim);padding:40px 0}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(13,13,14,.97);
  border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;align-items:center}
.hint{color:var(--ink-dim);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Triagem do portfólio</h1>
  <div class="sub">Marque seu papel em cada vídeo. Salva sozinho no navegador — pode fechar e voltar depois.</div>
  <div class="bar">
    <input type="search" id="q" placeholder="Filtrar por título…">
    <button data-f="todos" class="flt" aria-pressed="true">Todos</button>
    <button data-f="pendentes" class="flt">Pendentes</button>
    <button data-f="marcados" class="flt">Já marcados</button>
    <button data-f="destaques" class="flt">★ Destaques</button>
    <span class="counts" id="counts"></span>
  </div>
</header>
<main id="list"><div class="empty">Carregando catálogo…</div></main>
<footer>
  <button class="primary" id="exp">Baixar videos.json</button>
  <button id="imp">Importar backup</button>
  <input type="file" id="file" accept=".json" hidden>
  <span class="hint">Papéis: <b>Editei</b> = montagem/finalização · <b>Gravei</b> = câmera · <b>Ao vivo</b> = transmissão · <b>Particip.</b> = apareço/equipe · <b>Não é meu</b> = descartar</span>
</footer>
<script>
const ROLES=[["editei","Editei"],["gravei","Gravei"],["vivo","Ao vivo"],["partic","Particip."]];
const CATS=[
 ["Agenda Cultural",/AGENDA CULTURAL/i],
 ["Vem Comigo Travel",/VEM COMIGO/i],
 ["Conexão Rural",/CONEX[ÃA]O RURAL/i],
 ["Hiperconexão",/HIPER ?CONEX[ÕO]|SABE OU N[ÃA]O SABE/i],
 ["Estação do Saber",/ESTA[ÇC][ÃA]O DO SABER/i],
 ["Na Ponta do Giz",/NA PONTA DO GIZ/i],
 ["Cine-Conexões",/CINE.?CONEX[ÕO]ES/i],
 ["Nós em Revista",/N[ÓO]S EM REVISTA/i],
 ["Descomplique sua Redação",/DESCOMPLIQUE SUA REDA[ÇC][ÃA]O|TEMPORADA \(EP/i],
 ["Gestão e Negócios",/GEST[ÃA]O E NEG[ÓO]CIOS/i],
 ["Conexão Saúde",/CONEX[ÃA]O SA[ÚU]DE/i],
 ["Previsão do Tempo",/PREVIS[ÃA]O DO TEMPO/i],
 ["Ao vivo / Transmissões",/\[AO VIVO\]|AUL[ÃA]O|LIVE/i],
];
function categoriaDe(t){const c=CATS.find(([,re])=>re.test(t));return c?c[0]:"Outros";}
/* Títulos e IDs vêm do YouTube (dado de terceiro). Escapar antes de ir pro HTML,
   senão um título com <img onerror=...> executa script nesta página. */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escId(s){return String(s).replace(/[^A-Za-z0-9_-]/g,"");}
const KEY="raulzito_triagem_v1";
let data=[], marks=JSON.parse(localStorage.getItem(KEY)||"{}"), filter="todos", q="";

function save(){localStorage.setItem(KEY,JSON.stringify(marks));paint();}
function m(id){return marks[id]||(marks[id]={roles:[],star:false,no:false});}

function toggleRole(id,r){const e=m(id);e.no=false;
  e.roles.includes(r)?e.roles=e.roles.filter(x=>x!==r):e.roles.push(r);save();}
function toggleStar(id){const e=m(id);e.star=!e.star;if(e.star)e.no=false;save();}
function toggleNo(id){const e=m(id);e.no=!e.no;if(e.no){e.roles=[];e.star=false;}save();}

function state(v){const e=marks[v.id];
  if(!e||(!e.roles.length&&!e.star&&!e.no))return"pendente";
  if(e.no)return"nao";return"marcado";}

function visible(){return data.filter(v=>{
  if(q&&!v.titulo.toLowerCase().includes(q))return false;
  const s=state(v),e=marks[v.id];
  if(filter==="pendentes")return s==="pendente";
  if(filter==="marcados")return s==="marcado";
  if(filter==="destaques")return e&&e.star;
  return true;});}

function paint(){
  const list=document.getElementById("list"), vis=visible();
  const done=data.filter(v=>state(v)!=="pendente").length;
  const mine=data.filter(v=>state(v)==="marcado").length;
  const stars=data.filter(v=>marks[v.id]&&marks[v.id].star).length;
  document.getElementById("counts").innerHTML=
    `<b>${done}</b>/${data.length} triados · <b>${mine}</b> no portfólio · <b>${stars}</b> ★ · exibindo ${vis.length}`;
  if(!vis.length){list.innerHTML='<div class="empty">Nada aqui com esse filtro.</div>';return;}
  list.innerHTML=vis.map(v=>{
    const e=marks[v.id]||{roles:[],star:false,no:false};
    const col=e.no?"#3a3a3c":e.star?"var(--warn)":e.roles.length?"var(--ok)":"transparent";
    return `<div class="row" data-done="${state(v)!=="pendente"&&!e.roles.length&&!e.star?1:0}" style="border-left-color:${col}">
      <img loading="lazy" src="https://i.ytimg.com/vi/${escId(v.id)}/mqdefault.jpg" alt="">
      <div>
        <p class="t"><a href="https://youtu.be/${escId(v.id)}" target="_blank" rel="noopener">${esc(v.titulo)}</a></p>
        <div class="meta"><span>${esc(v.dur_fmt)}</span><span>${Number(v.views)||0} views</span><span>${escId(v.id)}</span></div>
      </div>
      <div class="acts">
        ${ROLES.map(([r,lbl])=>`<button data-id="${escId(v.id)}" data-role="${r}" aria-pressed="${e.roles.includes(r)}">${lbl}</button>`).join("")}
        <button class="star" data-id="${escId(v.id)}" data-star="1" aria-pressed="${!!e.star}" title="Destaque">★</button>
        <button class="no" data-id="${escId(v.id)}" data-no="1" aria-pressed="${!!e.no}">Não é meu</button>
      </div></div>`;}).join("");
}

document.getElementById("list").addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  if(b.dataset.role)toggleRole(b.dataset.id,b.dataset.role);
  else if(b.dataset.star)toggleStar(b.dataset.id);
  else if(b.dataset.no)toggleNo(b.dataset.id);});

document.querySelectorAll(".flt").forEach(b=>b.addEventListener("click",()=>{
  filter=b.dataset.f;document.querySelectorAll(".flt").forEach(x=>x.setAttribute("aria-pressed",x===b));paint();}));
document.getElementById("q").addEventListener("input",e=>{q=e.target.value.toLowerCase().trim();paint();});

document.getElementById("exp").addEventListener("click",()=>{
  const out=data.filter(v=>{const e=marks[v.id];return e&&!e.no&&(e.roles.length||e.star);})
   .map(v=>{const e=marks[v.id];return{id:v.id,titulo:v.titulo,categoria:categoriaDe(v.titulo),
     dur_fmt:v.dur_fmt,views:v.views,papeis:e.roles,destaque:!!e.star};});
  const blob=new Blob([JSON.stringify(out,null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="videos.json";a.click();});

document.getElementById("imp").addEventListener("click",()=>document.getElementById("file").click());
document.getElementById("file").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  const arr=JSON.parse(await f.text());
  arr.forEach(v=>{marks[v.id]={roles:v.papeis||[],star:!!v.destaque,no:false};});save();});

fetch("data/catalogo.json").then(r=>r.json()).then(async j=>{data=j;
  if(!Object.keys(marks).length){
    try{const seed=await fetch("data/videos.json").then(r=>r.ok?r.json():[]);
      seed.forEach(v=>{if(v.fonte!=="drive")marks[v.id]={roles:v.papeis||[],star:!!v.destaque,no:false};});
      localStorage.setItem(KEY,JSON.stringify(marks));}catch(e){}
  }
  paint();})
 .catch(()=>{document.getElementById("list").innerHTML=
   '<div class="empty">Não achei data/catalogo.json — abra esta página pelo servidor local (instruções no README).</div>';});
</script>
</body>
</html>
